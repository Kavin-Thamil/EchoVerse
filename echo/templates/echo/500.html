{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 | EchoVerse</title>

    <link rel="stylesheet" href="{% static 'echo/css/style.css' %}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #ffffff;
            font-family: "Poppins", sans-serif;
            text-align: center;
            padding: 2rem;
        }

        .error-container {
            max-width: 650px;
        }

        h1 {
            font-size: 7rem;
            color: #7c4dff;
            margin-bottom: 0;
        }

        h2 {
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #bdbdbd;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .btn-home {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: #7c4dff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        .btn-home:hover {
            background: #6a3df0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>500</h1>
        <h2>Something Went Off Beat</h2>
        
        <p>
            Our servers hit an unexpected note. Please try again in a few moments.
        </p>

        <a href="{% url 'home' %}" class="btn-home">
            Return Home
        </a>
    </div>

</body>
</html>
