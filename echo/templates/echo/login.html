{% extends "echo/base.html" %}

{% block title %}Login | EchoVerse{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">

        <div class="auth-card mx-auto">

            <h1 class="text-center mb-4">
                Login
            </h1>

            <form method="post" novalidate>
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Login
                </button>
            </form>

        </div>

    </div>
</section>
{% endblock %}
