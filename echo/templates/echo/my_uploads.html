{% extends "echo/base.html" %}

{% block title %}My Uploads | EchoVerse{% endblock %}

{% block content %}
<section class="songs-section">
    <div class="container">

        <h1 class="mb-3">
            My Uploads
        </h1>

        <p class="text-muted mb-5">
            Songs uploaded by you.
        </p>

        <div class="row g-4">

            {% for song in songs %}

                <div class="col-md-4">

                    <a
                        href="{% url 'song_detail' song.id %}"
                        class="text-decoration-none text-white"
                        aria-label="View {{ song.title }}"
                    >
                        <article class="music-card h-100">

                            <img
                                src="{{ song.cover_image.url }}"
                                alt="{{ song.title }} cover"
                                class="img-fluid"
                                loading="lazy"
                            >

                            <div class="p-3">

                                <h4>{{ song.title }}</h4>

                                <p>{{ song.genre }}</p>

                            </div>

                        </article>
                    </a>

                </div>

            {% empty %}

                <div class="col-12 text-center">

                    <div class="auth-card">

                        <h4>No uploads yet 🎵</h4>

                        <p class="text-muted mb-0">
                            Upload your first track.
                        </p>

                    </div>

                </div>

            {% endfor %}

        </div>

    </div>
</section>
{% endblock %}
